<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dana — photo diary</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #faf8f5;
    color: #292725;
    font-family: Georgia, serif;
}

header {
    text-align: center;
    padding: 45px 20px 30px;
}

h1 {
    font-size: 38px;
    margin: 0 0 10px;
    font-weight: normal;
}

.subtitle {
    color: #777;
    font-size: 16px;
    font-style: italic;
}

.gallery {
    columns: 3 250px;
    column-gap: 18px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

.photo {
    break-inside: avoid;
    margin-bottom: 18px;
}

.photo img {
    width: 100%;
    display: block;
    border-radius: 3px;
}

.photo p {
    margin: 7px 2px 15px;
    color: #777;
    font-size: 14px;
}

footer {
    text-align: center;
    padding: 45px 20px;
    color: #888;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <h1>Dana — photo diary</h1>
    <div class="subtitle">
        little moments · memories · everyday life
    </div>
</header>

<div class="gallery">

    <div class="photo">
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=800&q=80">
        <p>little things 🌿</p>
    </div>

    <div class="photo">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80">
        <p>an ordinary day</p>
    </div>

    <div class="photo">
        <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=800&q=80">
        <p>inspiration</p>
    </div>

    <div class="photo">
        <img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=800&q=80">
        <p>somewhere between moments</p>
    </div>

    <div class="photo">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80">
        <p>memories</p>
    </div>

    <div class="photo">
        <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=800&q=80">
        <p>life lately ✨</p>
    </div>

</div>

<footer>
    made with little pieces of life ♡
</footer>

</body>
</html>
